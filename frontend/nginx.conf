server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La app (SPA): cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifest no se cachean para que las actualizaciones lleguen enseguida
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash: cache largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API → backend
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
}
